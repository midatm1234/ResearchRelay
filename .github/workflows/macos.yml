name: macOS compatibility

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  macos:
    name: macOS 15 / ${{ matrix.architecture }} / Python 3.12
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            architecture: arm64
            machine: arm64
          - runner: macos-15-intel
            architecture: x64
            machine: x86_64
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          architecture: ${{ matrix.architecture }}
          cache: pip
          cache-dependency-path: requirements.lock.txt
      - name: Verify native macOS architecture
        env:
          EXPECTED_MACHINE: ${{ matrix.machine }}
        run: python -c "import os,platform; print(platform.platform(), platform.machine()); assert platform.system()=='Darwin'; assert platform.machine()==os.environ['EXPECTED_MACHINE']"
      - name: Install dependencies
        run: python -m pip install -r requirements.lock.txt -e ".[dev,browser]"
      - name: Tests and dependency consistency
        run: |
          python -m pytest -q
          python -m pip check
      - name: Build application wheel
        run: python -m pip wheel --no-deps --wheel-dir .runtime/dist .
      - name: Service and scientific workflow smoke
        run: python scripts/smoke.py
      - name: Shared literature handoff smoke
        run: python -m researchrelay.cli literature-pilot --workspace .runtime/ci-literature
      - name: Install portable browser
        run: python -m playwright install chromium
      - name: Browser workflow smoke
        run: python scripts/smoke.py --browser
      - name: Shared-project browser smoke
        run: python scripts/ui_shared_smoke.py --local-git
