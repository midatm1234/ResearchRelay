name: Portable project workflows

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  projects:
    name: Projects / ${{ matrix.os }} / Python 3.12
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.lock.txt
      - name: Install
        run: python -m pip install -r requirements.lock.txt -e ".[dev,browser]"
      - name: Tests
        run: python -m pytest -q
      - name: Check dependencies
        run: python -m pip check
      - name: Build
        run: python -m pip wheel --no-deps --wheel-dir .runtime/dist .
      - name: Multi-project CLI and agent handoff
        run: python scripts/project_smoke.py
      - name: Install browser
        run: python -m playwright install --with-deps chromium
      - name: Multi-project browser
        run: python scripts/ui_projects_smoke.py --demo
      - name: Shared knowledge refresh race regression
        run: python scripts/ui_shared_smoke.py
