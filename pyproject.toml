[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "coclaude"
version = "0.1.0"
description = "Artifact-first asynchronous scientific collaboration pilot"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1", "pydantic>=2.10,<3", "PyYAML>=6,<7", "httpx>=0.28,<1", "python-multipart>=0.0.20,<1", "jsonschema>=4.23,<5", "python-dotenv>=1,<2"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]
browser = ["playwright>=1.64,<2"]

[project.scripts]
coclaude = "coclaude.cli:main"

[tool.setuptools.packages.find]
include = ["coclaude*"]

[tool.setuptools.package-data]
coclaude = ["static/*", "schemas/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
